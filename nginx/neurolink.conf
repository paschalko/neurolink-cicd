# Nginx reverse proxy for Neurolink on the EC2 host.
# Install: sudo cp neurolink.conf /etc/nginx/sites-available/ && sudo ln -s ../sites-available/neurolink.conf /etc/nginx/sites-enabled/
# HTTPS:   sudo certbot --nginx -d your-domain.com   (adds the certificate lines and HTTP->HTTPS redirect)

server {
    listen 80;
    server_name your-domain.com;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
